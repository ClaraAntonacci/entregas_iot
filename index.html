<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de atividade do portão</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <header>
    <h1>Dashboard de atividade do portão</h1>
  </header>

  <main>

    <section class="grafico-container">
      <h2>Diariamente</h2>

      <div class="grafico">
        <canvas id="graficoDiario"></canvas>
      </div>
    </section>


    <section class="grafico-container semanal-container">
      <h2>Semanalmente</h2>

      <div class="grafico semanal">
        <canvas id="graficoSemanal"></canvas>
      </div>
    </section>


    <section class="tabela-container">

      <table>

        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Semana</th>
          </tr>
        </thead>

        <tbody id="tabelaDados"></tbody>

      </table>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
